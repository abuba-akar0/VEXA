[package]
name = "vexa-overlay"
version = "2.0.0"
description = "VEXA Desktop Overlay Agent"
authors = ["Antigravity"]
license = "MIT"
edition = "2021"

[lib]
name = "vexa_overlay_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.1", features = [] }
tauri-plugin-global-shortcut = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
device_query = "2.1.0"
